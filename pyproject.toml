[tool.poetry]
name = "parsers"
version = "0.1.0"
description = "Parsers"
authors = ["m0shanya"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.12.10"
pymongo = "4.12.1"
beautifulsoup4 = "4.13.4"
requests = "2.32.3"
kafka-python = "2.2.4"
redis = { version = "5.2.0", extras = ["hiredis"] }
aioredis = "2.0.1"
pandas = "2.2.3"
python-dotenv = "1.0.1"
motor = "3.7.0"
fastapi-cache2 = "0.2.2"
aiohttp = "3.11.18"
pydantic-settings = "2.9.1"
aiokafka = "0.12.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "3.7.1"
isort = "5.13.0"
black = "24.4.2"
flake8 = "6.0.0"
flake8-pyproject = "1.2.3"
bandit = "1.7.5"
pylint = "2.17.4"
fastapi-profiler = "1.2.0"
pyclean = "2.7.4"

[tool.poetry.group.test.dependencies]
pytest = "7.3.1"
pytest-cov = "5.0.0"
pytest-asyncio = "0.21.0"
pytest-env = "0.8.1"
faker = "18.10.1"
tqdm = "4.65.0"
factory-boy = "3.2.1"
factory-boy-extra = "0.1.3"

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
)/
'''

[tool.isort]
line_length = 88
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501"]
exclude = ["src/rpc/gen/", "migrations/"]

[tool.pylint]
disable = "C0103, C0116, C0114, C0115, W0719, C0301, E0611, W0511, W0718, R0912, R0914, R0903, R0801"
ignore = ["gen"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
